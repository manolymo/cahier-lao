name: Générer les sons

on:
  push:
    branches: [main]
    paths: ["l*.json", "gen_audio.py", ".github/workflows/audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.2.8
      - run: python gen_audio.py
      - name: Enregistrer les sons
        run: |
          git config user.name "cahier-lao-bot"
          git config user.email "cahier-lao-bot@users.noreply.github.com"
          git add audio sounds.json
          git diff --cached --quiet || (git commit -m "Sons générés" && git push)
